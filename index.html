<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTracker Fast</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fff; padding: 10px; margin: 0; }
        input { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .res { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .res img { width: 40px; height: 40px; margin-right: 10px; object-fit: cover; }
        .editor { display: none; padding-top: 20px; }
        .log-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<input type="text" id="q" placeholder="Hľadať potravinu..." oninput="dbSearch()">
<div id="results"></div>

<div id="editor" class="editor">
    <h3 id="pName"></h3>
    <input type="number" id="grams" value="100" oninput="recalc()">
    <div id="macros" style="margin:10px 0; font-weight:bold;"></div>
    <button style="width:100%; padding:15px; background:green; color:white; border:none; border-radius:8px;" onclick="add()">Pridať do denníka</button>
</div>

<div id="logArea"></div>

<script>
    let timer, activeP, history = JSON.parse(localStorage.getItem('h') || '[]');

    function dbSearch() {
        clearTimeout(timer);
        timer = setTimeout(() => {
            let q = document.getElementById('q').value;
            if (q.length < 3) return;
            fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${q}&json=1&page_size=5&fields=product_name,nutriments,image_small_url`)
            .then(r => r.json()).then(d => {
                document.getElementById('results').innerHTML = d.products.map(p => 
                    `<div class="res" onclick='select(${JSON.stringify(p)})'>
                        <img src="${p.image_small_url || ''}"> ${p.product_name || "Bez názvu"}
                    </div>`).join('');
            });
        }, 300);
    }

    function select(p) {
        activeP = { name: p.product_name, kcal: p.nutriments["energy-kcal_100g"]||0, b: p.nutriments["proteins_100g"]||0 };
        document.getElementById('pName').innerText = activeP.name;
        document.getElementById('results').innerHTML = '';
        document.getElementById('editor').style.display = 'block';
        recalc();
    }

    function recalc() {
        let f = document.getElementById('grams').value / 100;
        document.getElementById('macros').innerHTML = `Kcal: ${(activeP.kcal*f).toFixed(0)} | B: ${(activeP.b*f).toFixed(1)}g`;
    }

    function add() {
        history.push({n: activeP.name, v: document.getElementById('macros').innerText});
        localStorage.setItem('h', JSON.stringify(history));
        document.getElementById('editor').style.display = 'none';
        renderLog();
    }

    function renderLog() {
        document.getElementById('logArea').innerHTML = history.map(i => `<div class="log-item"><span>${i.n}</span><span>${i.v}</span></div>`).join('');
    }
    renderLog();
</script>
</body>
</html>
