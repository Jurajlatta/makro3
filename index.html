<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTab Ultra</title>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        #q { width: 100%; padding: 15px; border: 2px solid #007aff; border-radius: 8px; font-size: 16px; }
        .res { padding: 15px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<input type="text" id="q" placeholder="Píš názov..." oninput="search()">
<div id="results"></div>

<script>
    let timer;
    function search() {
        clearTimeout(timer);
        const q = document.getElementById('q').value;
        
        // Znížili sme limit na 2 znaky, aby to reagovalo okamžite
        if (q.length < 2) return; 

        timer = setTimeout(async () => {
            // Používame "search" endpoint, ktorý je tolerantnejší k preklepom
            const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&json=1&page_size=5&lc=sk`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.products && data.products.length > 0) {
                    document.getElementById('results').innerHTML = data.products.map(p => 
                        `<div class="res">${p.product_name || "Produkt bez mena"}</div>`
                    ).join('');
                } else {
                    document.getElementById('results').innerHTML = "<div class='res'>Nenašlo sa nič...</div>";
                }
            } catch (err) {
                console.log("Chyba:", err);
            }
        }, 200); // 200ms je dostatočne rýchle pre "živý" pocit
    }
</script>
</body>
</html>
