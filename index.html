<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTab</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 10px; background: #fff; }
        #search-bar { width: 100%; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .res { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        .res img { width: 45px; height: 45px; margin-right: 15px; border-radius: 8px; background: #eee; }
    </style>
</head>
<body>

<input type="text" id="q" placeholder="Hľadať potravinu..." oninput="fastSearch()">
<div id="results"></div>

<script>
    let debounce;
    function fastSearch() {
        clearTimeout(debounce);
        const q = document.getElementById('q').value;
        if (q.length < 2) return; // Začne hľadať už po 2 písmenách

        debounce = setTimeout(async () => {
            const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&json=1&page_size=6&fields=product_name,image_small_url`);
            const data = await res.json();
            document.getElementById('results').innerHTML = data.products.map(p => `
                <div class="res">
                    <img src="${p.image_small_url || ''}" onerror="this.style.display='none'">
                    <span>${p.product_name || 'Bez názvu'}</span>
                </div>
            `).join('');
        }, 200); // 200ms je "sweet spot" pre rýchlosť
    }
</script>
</body>
</html>
